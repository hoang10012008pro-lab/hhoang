        }
        .scroll-container {

                    image: "https://placehold.co/600x450/FFFF99/ffffff?text=Gối+Ôm+Con+Heo",

                },
            ]
        };
        
        function getCategoryIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('categoryId');
        }

        function getCategoryName(categoryId) {
            const categories = [
                { id: 1, name: "THỜI TRANG" },
                { id: 2, name: "MỸ PHẨM" },
                { id: 3, name: "ĐỒ GIA DỤNG" },
                { id: 4, name: "ĐỒ XÀM XÍ" }
            ];
            const category = categories.find(c => c.id === parseInt(categoryId));
            return category ? category.name : "Sản phẩm";
        }

        function renderProductsByCategoryId() {
            const categoryId = getCategoryIdFromUrl();
            const products = childProducts[categoryId];

            const productListContainer = document.getElementById('product-list');
            const categoryTitle = document.getElementById('category-title');
            
            categoryTitle.textContent = getCategoryName(categoryId);
            productListContainer.innerHTML = '';

            if (products && products.length > 0) {
                products.forEach(product => {
                    const productElement = document.createElement('div');
                    productElement.className = 'product-card p-6 flex flex-col items-center text-center';
                    productElement.innerHTML = `
                        <div class="relative w-full h-48 mb-4">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover rounded-xl shadow-inner">
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-2">${product.name}</h3>
                        <p class="text-gray-600 text-sm mb-6">${product.description}</p>
                        <a href="${product.affiliateLink}" target="_blank" class="inline-block bg-blue-500 text-white font-semibold py-3 px-8 rounded-full shadow-lg hover:bg-blue-600 transition duration-300">
                            Mua ngay
                        </a>
                    `;
                    productListContainer.appendChild(productElement);
                });
            } else {
                productListContainer.innerHTML = `<p class="text-center text-red-500 col-span-2">Không tìm thấy sản phẩm trong danh mục này.</p>`;
            }
        }

        window.onload = renderProductsByCategoryId;
    </script>
